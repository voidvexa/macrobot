<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#e8e2d3" />
    <script>
      (function () {
        var media = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function () {
          var dark = media.matches;
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          var theme = document.querySelector('meta[name="theme-color"]');
          if (theme) theme.setAttribute("content", dark ? "#06080a" : "#e8e2d3");
          var scheme = document.querySelector('meta[name="color-scheme"]');
          if (scheme) scheme.setAttribute("content", dark ? "dark" : "light");
        };
        apply();
        media.addEventListener("change", apply);
      })();
    </script>
    <title>ALMA</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%238f4c00'/></svg>" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
